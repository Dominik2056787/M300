apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fussball-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - fussball-dashboard
    secretName: fussball-tls
  rules:
  - host: fussball-dashboard
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 8080
      - path: /standings
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 5000
